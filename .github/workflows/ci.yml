name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze project source
      run: flutter analyze

    # flutter analyze does not run custom_lint rules: the analyzer plugin only
    # answers an IDE. Without this, riverpod_lint and this app's own rules have
    # never once failed a build, which is how a warning about the code in this
    # very commit sat unseen in an editor nobody had open.
    - name: Analyze provider usage
      run: dart run custom_lint

    # The rules are code, and a rule that has stopped matching fails nothing on
    # its own: it just quietly stops finding things.
    - name: Test the lint rules
      working-directory: tool/crimpy_lints
      run: dart pub get && dart test

  test:
    runs-on: ubuntu-latest

    # Runners are UTC, where no amount of Duration arithmetic on dates can go
    # wrong. The week and reminder date tests only bite in a zone that has a
    # DST transition, so the suite is run in one.
    env:
      TZ: Europe/Paris

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run tests
      run: flutter test