name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze project source
      run: flutter analyze

  # The override key set is the backend's, and a key it names that this app does
  # not read is dropped from the prescription the athlete plays rather than
  # merely ignored here. The vendored copy is what the tests hold applyOverride
  # and the chips to, so it has to be the copy the backend actually ships.
  contract:
    name: Override key contract
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compare the override key set with crimpy-backend
      run: |
        URL=https://raw.githubusercontent.com/Krakoer/crimpy-backend/dev/contract/override-keys.json
        if ! curl -fsSL "$URL" -o canonical.json; then
          echo "Could not read $URL."
          echo "The canonical list lives in crimpy-backend; restore it there before this can pass."
          exit 1
        fi
        if ! diff -u canonical.json contract/override-keys.json; then
          echo
          echo "contract/override-keys.json has drifted from crimpy-backend dev."
          echo "Copy the canonical file over, then make the override contract tests pass:"
          echo "a key added on the left has to be read by TrainingItem.applyOverride"
          echo "and named by overrideChipLabels before an athlete can play it."
          exit 1
        fi

  test:
    runs-on: ubuntu-latest

    # Runners are UTC, where no amount of Duration arithmetic on dates can go
    # wrong. The week and reminder date tests only bite in a zone that has a
    # DST transition, so the suite is run in one.
    env:
      TZ: Europe/Paris

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run tests
      run: flutter test