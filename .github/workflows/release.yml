name: Release

on:
  push:
    tags:
      # Production, and the beta channel the pre-prod test runs on. A beta tag
      # starts with b, so the two patterns cannot both match one tag.
      - 'v*'
      - 'beta-v*'

jobs:
  build:
    runs-on: ubuntu-latest

    # The repository defaults workflow tokens to read only, so the release step
    # has to ask for write here. Nothing listens to release events, so the built
    # in token not triggering further workflows costs nothing.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Everything below is shared between the two channels: same signing, same
    # obfuscation, same symbol upload. Only the flavor, the artifact name and
    # whether GitHub marks the release a prerelease differ.
    - name: Resolve the release channel
      id: channel
      run: |
        case "$GITHUB_REF_NAME" in
        beta-v*)
          echo "flavor=beta" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          ;;
        v*)
          echo "flavor=prod" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          ;;
        *)
          echo "tag $GITHUB_REF_NAME matches no release channel" >&2
          exit 1
          ;;
        esac

    # Nothing in this repo changes when the backend adds an override key, so a
    # tag cut off an unchanged dev is the one path that could ship a build whose
    # applyOverride drops one. The question here is narrower than the one the PR
    # job asks: not whether the vendored list is the current one, but whether
    # this build reads every key the deployed backend can send. The backend
    # deploys from main, and this app running ahead of it is normal.
    #
    # It compares the key sets and not the merge, which the tests own. A branch
    # that vendored a key without reading it is red on CI; merging that anyway
    # and tagging it is the one hole left here.
    #
    # 200 compares. Anything else is red, including a 404: the contract has been
    # on main since it was released there, so a miss now means the ref moved, the
    # file moved, or crimpy-backend is unreachable, and a gate that cannot see
    # what it guards does not pass.
    - name: Check the deployed backend sends no override key this build drops
      run: |
        CONTRACT=contract/override-keys.json
        BASE=https://raw.githubusercontent.com/Krakoer/crimpy-backend
        REF=main
        URL=$BASE/$REF/$CONTRACT
        trap 'rm -f deployed.json' EXIT
        code=$(curl -sSL --retry 3 --retry-all-errors -o deployed.json -w '%{http_code}' "$URL") || code=000
        if [ "$code" != "200" ]; then
          echo "Could not read $URL (HTTP ${code:-000})." >&2
          echo "000 means the fetch never landed, so the contract itself may be fine." >&2
          echo "A 404 cannot tell a moved ref from a moved or deleted file, so check the ref" >&2
          echo "in the URL above before restoring anything in crimpy-backend." >&2
          exit 1
        fi
        if ! jq -e '.keys | type == "array"' deployed.json >/dev/null 2>&1; then
          echo "$URL did not answer the contract: no keys array, so the deployed key set" >&2
          echo "could not be read. An error page served with a 200 looks like this." >&2
          exit 1
        fi
        missing=$(jq -rn \
          --slurpfile deployed deployed.json \
          --slurpfile vendored "$CONTRACT" \
          '[$deployed[0].keys[].key] - [$vendored[0].keys[].key] | join(", ")')
        if [ -n "$missing" ]; then
          echo "the deployed backend sends override keys this build drops: $missing" >&2
          echo "Vendor contract/override-keys.json from crimpy-backend and make applyOverride read them." >&2
          exit 1
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    # The symbol upload runs after a build that takes several minutes, so check
    # its token up front rather than fail the release at the last step.
    - name: Check the Sentry auth token
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      run: |
        if [ -z "$SENTRY_AUTH_TOKEN" ]; then
          echo "missing repository secret SENTRY_AUTH_TOKEN" >&2
          exit 1
        fi

    # Gradle only wires the upload signing config when android/key.properties is
    # there, so without these secrets the release APK would be signed with the
    # debug key. Stop before building rather than publish that.
    - name: Write signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        umask 077
        for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!secret}" ]; then
            echo "missing repository secret ANDROID_$secret" >&2
            exit 1
          fi
        done
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        # java.util.Properties reads a backslash as an escape and drops a leading
        # space, so a password carrying either would reach Gradle mangled.
        property() {
          local value=${2//\\/\\\\}
          printf '%s=%s\n' "$1" "${value/# /\\ }"
        }
        {
          property storeFile upload-keystore.jks
          property storePassword "$KEYSTORE_PASSWORD"
          property keyAlias "$KEY_ALIAS"
          property keyPassword "$KEY_PASSWORD"
        } > android/key.properties

    # Obfuscated so the AOT Dart frames Sentry receives can be symbolicated:
    # --split-debug-info writes the .symbols files and the obfuscation map is
    # what pubspec.yaml points sentry_dart_plugin at. A plain --release build
    # publishes an APK whose stack traces are bare addresses forever.
    - name: Build Android APK
      run: |
        flutter build apk --flavor ${{ steps.channel.outputs.flavor }} --release \
          --obfuscate \
          --split-debug-info=build/debug-info \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json

    # sentry_dart_plugin only warns and exits 0 when the obfuscation map is
    # missing, so without this the release would publish green with obfuscated
    # class names in every issue title. The .symbols upload does fail hard, but
    # check both here rather than rely on which half is loud.
    - name: Check the symbol artifacts
      run: |
        if [ ! -s build/app/obfuscation.map.json ]; then
          echo "the build produced no obfuscation map" >&2
          exit 1
        fi
        if ! ls build/debug-info/app.android-*.symbols >/dev/null 2>&1; then
          echo "the build produced no split debug info" >&2
          exit 1
        fi
        ls -l build/app/obfuscation.map.json build/debug-info

    # The fingerprint of the upload certificate, which is public: it comes out of
    # ./gradlew :app:signingReport. Pinning it rejects the debug key and any other
    # keystore just as well, and an APK signed by one of those is one no install
    # can update over.
    - name: Check the APK signer
      env:
        UPLOAD_CERT_SHA256: 6f4ee74549c3a45ecb75eda778ebd6cc08624707f7737e87808be23ba3c217c9
        APK: build/app/outputs/flutter-apk/app-${{ steps.channel.outputs.flavor }}-release.apk
      run: |
        if [ -z "${ANDROID_HOME:-}" ]; then
          echo "ANDROID_HOME is not set" >&2
          exit 1
        fi
        apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
        if [ -z "$apksigner" ]; then
          echo "no apksigner in $ANDROID_HOME/build-tools" >&2
          exit 1
        fi
        if ! certs=$("$apksigner" verify --print-certs "$APK" 2>&1); then
          echo "$certs" >&2
          echo "the APK is not signed" >&2
          exit 1
        fi
        echo "$certs"
        if ! echo "$certs" | grep -qi "SHA-256 digest: $UPLOAD_CERT_SHA256"; then
          echo "the APK is not signed with the upload key" >&2
          exit 1
        fi

    # Before the release is published, so a failed upload stops the tag from
    # shipping an APK nothing can symbolicate.
    - name: Upload debug symbols to Sentry
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      run: dart run sentry_dart_plugin

    - name: Remove signing config
      if: always()
      run: rm -f android/key.properties android/app/upload-keystore.jks

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-${{ steps.channel.outputs.flavor }}-release.apk
        draft: false
        prerelease: ${{ steps.channel.outputs.prerelease }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
