name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    # Gradle only wires the upload signing config when android/key.properties is
    # there, so without these secrets the release APK would be signed with the
    # debug key. Stop before building rather than publish that.
    - name: Write signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        umask 077
        for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!secret}" ]; then
            echo "missing repository secret ANDROID_$secret" >&2
            exit 1
          fi
        done
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        cat > android/key.properties <<EOF
        storeFile=upload-keystore.jks
        storePassword=$KEYSTORE_PASSWORD
        keyAlias=$KEY_ALIAS
        keyPassword=$KEY_PASSWORD
        EOF

    - name: Build Android APK
      run: flutter build apk --flavor prod --release

    - name: Check the APK is not debug signed
      run: |
        apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -n 1)
        if [ -z "$apksigner" ]; then
          echo "no apksigner in $ANDROID_HOME/build-tools" >&2
          exit 1
        fi
        if ! certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-prod-release.apk 2>&1); then
          echo "$certs" >&2
          echo "the APK is not signed" >&2
          exit 1
        fi
        echo "$certs"
        if echo "$certs" | grep -q "CN=Android Debug"; then
          echo "the APK is signed with the debug key" >&2
          exit 1
        fi

    - name: Remove signing config
      if: always()
      run: rm -f android/key.properties android/app/upload-keystore.jks

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-prod-release.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
