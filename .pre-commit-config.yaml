repos:
  - repo: local
    hooks:
      - id: flutter-format
        name: Flutter Format
        entry: dart format --set-exit-if-changed
        language: system
        files: \.dart$
        pass_filenames: false
        args: ["lib/", "test/"]

      - id: flutter-analyze
        name: Flutter Analyze
        entry: flutter analyze
        language: system
        files: \.dart$
        pass_filenames: false