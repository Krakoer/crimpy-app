repos:
  - repo: local
    hooks:
      - id: flutter-format
        name: Flutter Format
        entry: tool/without_git_env.sh dart format --set-exit-if-changed
        language: script
        files: \.dart$
        pass_filenames: false
        # Matches what CI formats, which is everything. Leaving tool/ out is
        # how a commit passes here and fails there.
        args: ["lib/", "test/", "tool/"]

      - id: flutter-analyze
        name: Flutter Analyze
        entry: tool/without_git_env.sh flutter analyze
        language: script
        files: \.dart$
        pass_filenames: false

      # Runs the rules flutter analyze does not: riverpod_lint, and this app's
      # own. Slower than the rest of the hooks, and worth it for the class of
      # bug it catches.
      - id: custom-lint
        name: Provider Usage
        entry: tool/without_git_env.sh dart run custom_lint
        language: script
        files: \.dart$
        pass_filenames: false