name: crimpy_lints
description: Lint rules specific to this app, run by custom_lint alongside riverpod_lint.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  # Pinned to what riverpod_lint 3.0.3 resolves to. custom_lint resolves its
  # plugin client independently of pubspec.lock, so a looser constraint here is
  # how the analyzer plugin stops starting for everyone.
  analyzer: ^8.4.0
  custom_lint_builder: 0.8.1

dev_dependencies:
  custom_lint:
  path: ^1.9.0
  test: ^1.25.0
